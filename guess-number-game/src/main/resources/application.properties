spring.application.name=guess-number-game

# XAMPP MySQL defaults: host localhost, port 3306, user root, blank password.
# Override DB_USERNAME / DB_PASSWORD in your environment if your setup differs.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/guess_number_game?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development only. Use Flyway migrations and validate in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

# Local development fallback only. Set JWT_SECRET to a private value outside development.
app.jwt.secret=${JWT_SECRET:local-development-secret-key-change-before-production-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Redis-backed leaderboard cache (local Redis defaults).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.cache-names=leaderboard,userInfo
spring.cache.redis.time-to-live=${LEADERBOARD_CACHE_TTL:5s}

# PayPal sandbox. Set the Client ID/Secret from a PayPal Developer REST app locally.
app.paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
app.paypal.client-id=${PAYPAL_CLIENT_ID:}
app.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
app.paypal.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.paypal.currency=${PAYPAL_CURRENCY:USD}
app.paypal.turns-package-price=${PAYPAL_TURNS_PRICE:1.00}
app.paypal.turns-package-amount=${PAYPAL_TURNS_AMOUNT:5}
